name: validation

on:
  push:
  pull_request:

jobs:
  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build simulator with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DEDGE_ENABLE_TSAN=ON
          cmake --build build-tsan
          python -m pip install -e ".[dev]"
      - name: Exercise concurrent device operations
        env:
          EDGE_SIMULATOR_BIN: ${{ github.workspace }}/build-tsan/edge_device_simulator
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: pytest -q tests/test_control_protocol.py -k concurrent

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure C++ with sanitizers
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEDGE_ENABLE_SANITIZERS=ON
      - name: Configure C++
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++
        run: cmake --build build --config Debug
      - name: Run C++ tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build -C Debug --output-on-failure
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Resolve simulator path on Linux
        if: runner.os == 'Linux'
        run: echo "EDGE_SIMULATOR_BIN=$GITHUB_WORKSPACE/build/edge_device_simulator" >> "$GITHUB_ENV"
      - name: Resolve simulator path on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Get-ChildItem build -Recurse -Filter edge_device_simulator.exe | Select-Object -First 1 -ExpandProperty FullName
          "EDGE_SIMULATOR_BIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Static checks
        run: |
          ruff check src tests scripts/run_demo.py
          mypy src
      - name: Python tests and coverage
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: pytest --junitxml=artifacts/junit.xml --cov --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            artifacts/
            coverage.xml


